name: Refresh spoiler-safe highlights

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions' fastest supported schedule is every five minutes. Keep
    # the expression deliberately simple so the scheduler can trigger it
    # reliably from the default branch.
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-spoiler-safe-highlights
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Retrying after a normal site update requires a fresh generated
          # file, not a rebase of two independently generated JSON indexes.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install video metadata reader
        run: python -m pip install --disable-pip-version-check --quiet yt-dlp
      - name: Find new highlights
        run: node scripts/update-highlights.mjs
        env:
          # A broader pass keeps the seven-day match window well populated,
          # while the workflow's concurrency guard prevents overlapping runs.
          MAX_HIGHLIGHT_CHECKS: '32'
      - name: Save new matches
        run: |
          if git diff --quiet -- assets/highlights.js; then
            exit 0
          fi
          git config user.name "spoilmenot highlights bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if git diff --quiet -- assets/highlights.js; then
              exit 0
            fi
            git add assets/highlights.js
            git commit -m "Refresh spoiler-safe highlights"
            if git push origin HEAD:main; then
              exit 0
            fi
            # A normal site push landed while this job searched YouTube. Do
            # not merge generated indexes: start from current main and make a
            # fresh, conflict-free highlights commit instead.
            git fetch origin main
            git reset --hard origin/main
            node scripts/update-highlights.mjs
          done
          echo "Could not push refreshed highlights after three safe retries."
          exit 1
