name: Refresh spoiler-safe highlights

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-spoiler-safe-highlights
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # The generated highlights commit may need to replay on top of a
          # normal site update that lands while this job is running.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install video metadata reader
        run: python -m pip install --disable-pip-version-check --quiet yt-dlp
      - name: Find new highlights
        run: node scripts/update-highlights.mjs
        env:
          MAX_HIGHLIGHT_CHECKS: '20'
      - name: Save new matches
        run: |
          if git diff --quiet -- assets/highlights.js; then
            exit 0
          fi
          git config user.name "spoilmenot highlights bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/highlights.js
          git commit -m "Refresh spoiler-safe highlights"
          # A user push can land after this job starts. Rebase the generated
          # one-file commit onto main and retry, without ever force-pushing.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not push refreshed highlights after three safe retries."
          exit 1
