<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11110f">
  <title>Spoil Me Not — Gameplot</title>
  <link rel="preconnect" href="https://site.api.espn.com">
  <link rel="icon" type="image/svg+xml" href="assets/spoil-me-not-icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="masthead">
      <a class="wordmark" href="#" aria-label="Spoil Me Not home"><img src="assets/spoil-me-not-logo.png" alt="Spoil Me Not"></a>
      <nav id="league-switcher" class="league-switcher" aria-label="Choose league"></nav>
      <nav id="team-ribbon" class="team-ribbon" aria-label="Filter teams"></nav>
      <div class="team-filter"><button id="team-toggle" class="team-toggle">TEAMS</button><div id="team-picker" class="team-picker" hidden><input id="team-search" type="search" placeholder="Filter teams" aria-label="Filter teams"><div id="team-results" class="team-results"></div></div></div>
      <div class="masthead-actions"><button id="now-button" class="now-button" aria-label="Go to now"><span aria-hidden="true">↗</span><b>GO TO NOW</b></button></div>
    </header>
    <section id="team-selector" class="team-selector" aria-label="Choose teams" hidden>
      <div class="team-selector-head"><b>TEAMS</b><div><button type="button" data-select-all>ALL</button><button type="button" data-close-selector>DONE</button></div></div>
      <div id="team-gallery" class="team-gallery"></div>
    </section>
    <section id="league-selector" class="league-selector" aria-label="Choose league" hidden>
      <div class="team-selector-head"><b>LEAGUE</b><div><button type="button" data-close-leagues>DONE</button></div></div>
      <div id="league-gallery" class="league-gallery"></div>
    </section>
    <div class="view-toggle" aria-label="View mode"><button data-view="map">MAP</button><button data-view="list" class="active">LIST</button></div>
    <button id="reveal-all" class="reveal-all">REVEAL ALL</button>
    <div id="team-hover-label" class="team-hover-label" hidden></div>
    <div id="team-preview" class="team-preview" hidden></div>
    <section class="plot-shell" aria-label="Gameplot, time horizontally and excitement vertically">
      <div id="deck-container"></div>
      <div id="focus-window" aria-hidden="true"></div><div id="live-zone" aria-hidden="true"><span>LIVE NOW</span></div><div id="focus-ticks" aria-hidden="true"></div>
      <div class="axis axis-left" aria-hidden="true">
        <span class="y100">100 <i>ESSENTIAL</i></span><span class="y75">75 <i>STRONG</i></span>
        <span class="y50">50 <i>HIDDEN / NEUTRAL</i></span><span class="y25">25 <i>LOW</i></span>
      </div>
      <div id="time-axis" class="time-axis" aria-hidden="true"></div>
      <div id="now-line" class="now-line" aria-hidden="true"><b>NOW</b></div>
      <div class="hint">DRAG TO EXPLORE <span>·</span> SCROLL TO ZOOM</div>
      <div id="loading" class="loading">Loading the season</div>
      <div id="error" class="error" hidden></div>
    </section>
    <section id="list-shell" class="list-shell" hidden aria-label="Chronological fixture list"></section>
  </main>
  <section id="spoil-meter-modal" class="spoil-meter-modal" aria-label="Choose a league" role="dialog" aria-modal="true">
    <div class="spoil-meter-dialog league-choice-dialog">
      <h1>Choose a league</h1>
      <div class="league-choice-grid">
        <button type="button" data-choose-league="all"><b>ALL</b><span>All Leagues</span></button>
        <button type="button" data-choose-league="epl"><img class="league-choice-mark league-choice-image" src="assets/leagues/epl-official.png" alt=""><b>EPL</b><span>Premier League</span></button>
        <button type="button" data-choose-league="laliga"><img class="league-choice-mark league-choice-image" src="assets/leagues/laliga-official.png" alt=""><b>LA LIGA</b><span>La Liga</span></button>
        <button type="button" data-choose-league="ucl"><img class="league-choice-mark league-choice-image" src="assets/leagues/ucl-official.png" alt=""><b>UCL</b><span>Champions League</span></button>
        <button type="button" data-choose-league="mlb"><img class="league-choice-mark league-choice-image" src="assets/leagues/mlb-official.png" alt=""><b>MLB</b><span>Major League Baseball</span></button>
        <button type="button" data-choose-league="nfl"><img class="league-choice-mark league-choice-image" src="assets/leagues/nfl-official.png" alt=""><b>NFL</b><span>National Football League</span></button>
      </div>
    </div>
  </section>
  <section id="match-info" class="match-info" hidden aria-live="polite"></section>
  <script src="https://unpkg.com/deck.gl@9.1.12/dist.min.js"></script>
  <script src="assets/highlights.js"></script>
  <script src="js/watchScore.js"></script>
  <script src="js/anticipation.js"></script>
  <script src="js/data.js"></script>
  <script src="js/gameplot.js"></script>
  <script src="js/app.js"></script>
  <script src="js/brand.js"></script>
</body>
</html>
